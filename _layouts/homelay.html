---
layout: default
---
<div id="homeid" class="col-sm-12 vdel-homepage">
  {{ content }}
  <section class="vdel-home-news" aria-labelledby="home-news-heading">
    <div class="vdel-section-heading">
      <h2 id="home-news-heading">News</h2>
      <p>Updates from the lab</p>
    </div>
    <div class="vdel-news-list">
      {% for article in site.data.news limit:6 %}
      <div class="vdel-news-item">
        <div class="vdel-news-date">{{ article.date }}</div>
        <div>{{ article.headline }}</div>
      </div>
      {% endfor %}
    </div>
    <p class="vdel-more-papers"><a href="{{ '/allnews.html' | relative_url }}">All news →</a></p>
  </section>
</div>
