# Site settings
title: "Levent Burak Kara | Visual Design and Engineering Lab"
email: lkara@cmu.edu
description: >-
  Levent Burak Kara and the Visual Design and Engineering Laboratory at
  Carnegie Mellon University develop artificial intelligence, geometric,
  and physics-based methods for engineering design, simulation, and
  manufacturing.

url: "https://levburkara.github.io"
baseurl: ""

author:
  name: "Levent Burak Kara"
  title: "Professor of Mechanical Engineering"
  institution: "Carnegie Mellon University"

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
